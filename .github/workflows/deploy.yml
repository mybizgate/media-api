# MyBizGate Media API - production deployment
#
# Push to deploy -> GitHub Actions -> FTPS -> /home/mybizgat/app/media-api
#
# Prerequisite: the production server already has a working Laravel installation,
# including vendor/ installed manually (e.g., with FileZilla).
# This workflow deploys APPLICATION CODE ONLY, not Composer dependencies.
# If composer.lock changes, update production vendor/ separately first.
#
# The dedicated FTP user's home directory is /home/mybizgat/app/media-api.
# Production .env, vendor/, storage/, and bootstrap/cache/ are NEVER synced.
# Uploaded media lives outside this FTP root and is left untouched.

name: Deploy Production

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PRODUCTION_URL: https://media-api.mybizgate.com
  HEALTH_URL: https://media-api.mybizgate.com/api/v1/health

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, xml, curl, zip, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install dependencies for CI tests
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create temporary CI environment
        run: |
          cp .env.example .env
          mkdir -p "$RUNNER_TEMP/media"
          sed -i "s#^MEDIA_STORAGE_PATH=.*#MEDIA_STORAGE_PATH=$RUNNER_TEMP/media#" .env
          php artisan key:generate --force --no-interaction

      - name: Validate Laravel
        run: |
          php artisan --version
          php artisan route:list
          php artisan test

      - name: Prepare application-only deployment package
        run: |
          rm -f .env
          mkdir -p release

          # Dependencies and server-managed files are intentionally omitted.
          rsync -a ./ release/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='release/' \
            --exclude='deploy/' \
            --exclude='vendor/' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='tests/' \
            --exclude='phpunit.xml' \
            --exclude='.phpunit.result.cache' \
            --exclude='node_modules/' \
            --exclude='AUTO_DEPLOY_WF.md' \
            --exclude='database/*.sqlite' \
            --exclude='database/*.sqlite-*'

          # Health endpoint uses this to confirm the deployed Git commit.
          jq -n \
            --arg commit "$GITHUB_SHA" \
