# MyBizGate Media API - production deployment
# This workflow deploys Laravel application code only over FTPS.
# Prerequisite: vendor/ is already installed on the production server and
# compatible with composer.lock. Update production vendor/ when dependencies change.
# The FTP account is rooted at /home/mybizgat/app/media-api.
# Never upload production .env, vendor/, storage/, or bootstrap/cache/.

name: Deploy Production

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PRODUCTION_URL: https://media-api.mybizgate.com
  HEALTH_URL: https://media-api.mybizgate.com/api/v1/health

jobs:
  deploy:
    name: Deploy Laravel application
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, xml, curl, zip, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install dependencies for CI tests
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create temporary CI environment
        run: |
          cp .env.example .env
          mkdir -p "$RUNNER_TEMP/media"
          sed -i "s#^MEDIA_STORAGE_PATH=.*#MEDIA_STORAGE_PATH=$RUNNER_TEMP/media#" .env
          php artisan key:generate --force --no-interaction

      - name: Validate Laravel
        run: |
          php artisan --version
          php artisan route:list
          php artisan test

      - name: Prepare application-only deployment package
        run: |
          rm -f .env
          mkdir -p release
          rsync -a ./ release/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='release/' \
            --exclude='deploy/' \
            --exclude='vendor/' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='tests/' \
            --exclude='phpunit.xml' \
            --exclude='.phpunit.result.cache' \
            --exclude='node_modules/' \
            --exclude='AUTO_DEPLOY_WF.md' \
            --exclude='database/*.sqlite' \
            --exclude='database/*.sqlite-*'

          mkdir -p release/bootstrap
          jq -n --arg commit "$GITHUB_SHA" --arg deployed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commit: $commit, deployed_at: $deployed_at}' > release/bootstrap/deployment.json
          cat release/bootstrap/deployment.json

      - name: Verify application-only package
        run: |
          test -f release/artisan
          test -f release/bootstrap/app.php
          test -f release/bootstrap/deployment.json
          test -f release/routes/api.php
          test ! -e release/.env
          test ! -d release/vendor
          test ! -d release/storage
          test ! -d release/tests
          du -sh release

      # Only the application code is uploaded. vendor/, storage/, .env and
      # bootstrap/cache/ are server-managed and excluded here as well, so the
      # sync can never delete them even if a stale state file lists them.
      - name: Deploy Laravel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./release/
          # FTP_USERNAME is rooted at /home/mybizgat/app/media-api (see header).
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          log-level: minimal
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.env.*
            **/vendor/**
            **/storage/**
            **/bootstrap/cache/**
            **/node_modules/**

      - name: Verify production runs the pushed commit
        run: |
          EXPECTED="${GITHUB_SHA::8}"
          LIVE=""
          RESPONSE=""

          for attempt in $(seq 1 18); do
            RESPONSE=$(curl -sS --max-time 30 \
              -H "Cache-Control: no-cache" \
              -H "Pragma: no-cache" \
              "${HEALTH_URL}?nocache=${GITHUB_SHA}-${attempt}" || true)
            LIVE=$(printf '%s' "$RESPONSE" | jq -r '.deployment.commit // empty' 2>/dev/null || true)
            echo "attempt ${attempt}: live commit '${LIVE}' (expected '${EXPECTED}')"
            if [ "$LIVE" = "$EXPECTED" ]; then
              break
            fi
            sleep 10
          done

          printf '%s\n' "$RESPONSE" | jq .

          if [ "$LIVE" != "$EXPECTED" ]; then
            echo "::error::Production reports commit '${LIVE}', expected '${EXPECTED}'. Deployment NOT verified."
            exit 1
          fi

          printf '%s' "$RESPONSE" | jq -e '
            .status == "ok"
            and .service == "MyBizGate Media API"
            and .environment == "production"
            and .storage == true
            and .gd == true
            and .webp == true
          ' > /dev/null || { echo "::error::Health checks failed after deployment."; exit 1; }

          echo "Production is running ${EXPECTED} (deployed_at $(printf '%s' "$RESPONSE" | jq -r '.deployment.deployed_at'))."

      - name: Verify ping route is live
        run: |
          PING=$(curl -sS --max-time 30 -H "Cache-Control: no-cache" \
            "${PRODUCTION_URL}/api/v1/ping?nocache=${GITHUB_SHA}")
          printf '%s\n' "$PING" | jq .
          printf '%s' "$PING" | jq -e '.success == true and .data.pong == true' > /dev/null \
            || { echo "::error::GET /api/v1/ping did not answer pong."; exit 1; }

      - name: Verify existing media survived (repository variable SMOKE_MEDIA_ID)
        env:
          SMOKE_MEDIA_ID: ${{ vars.SMOKE_MEDIA_ID }}
        run: |
          if [ -z "$SMOKE_MEDIA_ID" ]; then
            echo "SMOKE_MEDIA_ID is not set; skipping persistent media check."
            exit 0
          fi
          for suffix in "" "/thumbnail" "/metadata" "/download"; do
            CODE=$(curl -sS -o /dev/null --max-time 30 -w '%{http_code}' \
              -H "Cache-Control: no-cache" \
              "${PRODUCTION_URL}/api/v1/media/${SMOKE_MEDIA_ID}${suffix}?nocache=${GITHUB_SHA}")
            echo "GET /api/v1/media/${SMOKE_MEDIA_ID}${suffix} -> ${CODE}"
            test "$CODE" = "200"
          done
