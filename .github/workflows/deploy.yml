# MyBizGate Media API - application-only production deployment
#
# Push branch 'deploy' -> test Laravel -> deploy PHP application files via FTPS.
# The application and its vendor/ dependencies have already been installed on Shinjiru.
#
# The dedicated FTP account must be rooted at /home/mybizgat/app/media-api.
# NEVER sync production .env, vendor/, storage/ or bootstrap/cache/.
# Uploaded media is outside this FTP root at /data/media-api/uploads/.
# IMPORTANT: If composer.lock changes, update production vendor/ separately before deploying.

name: Deploy Production

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PRODUCTION_URL: https://media-api.mybizgate.com
  HEALTH_URL: https://media-api.mybizgate.com/api/v1/health

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, xml, curl, zip, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install dependencies for CI tests
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create temporary CI environment
        run: |
          cp .env.example .env
          mkdir -p "$RUNNER_TEMP/media"
          sed -i "s#^MEDIA_STORAGE_PATH=.*#MEDIA_STORAGE_PATH=$RUNNER_TEMP/media#" .env
          php artisan key:generate --force --no-interaction

      - name: Validate Laravel
        run: |
          php artisan --version
          php artisan route:list
          php artisan test

      - name: Prepare application-only deployment package
        run: |
          rm -f .env
          mkdir -p release

          # Do not package dependencies or directories owned by the production server.
          rsync -a ./ release/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='release/' \
            --exclude='deploy/' \
            --exclude='vendor/' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='tests/' \
            --exclude='phpunit.xml' \
            --exclude='.phpunit.result.cache' \
            --exclude='node_modules/' \
            --exclude='AUTO_DEPLOY_WF.md' \
            --exclude='database/*.sqlite' \
            --exclude='database/*.sqlite-*'

          # The health endpoint exposes this commit to verify a real deployment.
          mkdir -p release/bootstrap
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg repository "$GITHUB_REPOSITORY" \
